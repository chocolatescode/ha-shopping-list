# Gotowy dashboard do wklejenia w całości (Edytor surowej konfiguracji nowego dashboardu).
# Wymaga: karty zakupy-lista-card i button-card (obie z HACS) oraz pakietu zakupy_lista.yaml.
button_card_templates:
  zakupy_chip:
    variables:
      i: 0
    show_icon: true
    show_name: true
    show_label: true
    show_state: false
    triggers_update:
      - sensor.lista_zakupow_czesto_kupowane
      - sensor.lista_zakupow_pozycje
    name: |
      [[[
      const c = (states['sensor.lista_zakupow_czesto_kupowane'] || { attributes: {} }).attributes.czeste || {};
      const e = Object.entries(c).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'pl'))[variables.i];
      const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
      return e ? cap(e[0]) : '';
      ]]]
    label: |
      [[[
      const c = (states['sensor.lista_zakupow_czesto_kupowane'] || { attributes: {} }).attributes.czeste || {};
      const e = Object.entries(c).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'pl'))[variables.i];
      const on = ((states['sensor.lista_zakupow_pozycje'] || { attributes: {} }).attributes.pozycje || []).includes(e ? e[0] : '');
      return !e ? '' : on ? 'na liście' : `dodawano ×${e[1]}`;
      ]]]
    icon: |
      [[[
      const c = (states['sensor.lista_zakupow_czesto_kupowane'] || { attributes: {} }).attributes.czeste || {};
      const e = Object.entries(c).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'pl'))[variables.i];
      const on = ((states['sensor.lista_zakupow_pozycje'] || { attributes: {} }).attributes.pozycje || []).includes(e ? e[0] : '');
      return on ? 'mdi:check-circle' : 'mdi:plus-circle-outline';
      ]]]
    tap_action:
      action: javascript
      javascript: |
        [[[
        const c = (states['sensor.lista_zakupow_czesto_kupowane'] || { attributes: {} }).attributes.czeste || {};
        const e = Object.entries(c).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'pl'))[variables.i];
        const on = ((states['sensor.lista_zakupow_pozycje'] || { attributes: {} }).attributes.pozycje || []).includes(e ? e[0] : '');
        const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
        if (!e || on) return;
        hass.callService('todo', 'add_item', { item: cap(e[0]) }, { entity_id: 'todo.lista_zakupow' });
        ]]]
    hold_action:
      action: none
    styles:
      card:
        - padding: 0 10px
        - height: 100%
        - background: |
            [[[
            const c = (states['sensor.lista_zakupow_czesto_kupowane'] || { attributes: {} }).attributes.czeste || {};
            const e = Object.entries(c).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'pl'))[variables.i];
            const on = ((states['sensor.lista_zakupow_pozycje'] || { attributes: {} }).attributes.pozycje || []).includes(e ? e[0] : '');
            return on ? 'rgba(var(--rgb-primary-color, 3,169,244), .15)' : 'var(--ha-card-background, var(--card-background-color))';
            ]]]
        - visibility: |
            [[[
            const c = (states['sensor.lista_zakupow_czesto_kupowane'] || { attributes: {} }).attributes.czeste || {};
            const e = Object.entries(c).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'pl'))[variables.i];
            return e ? 'visible' : 'hidden';
            ]]]
      grid:
        - grid-template-areas: '"i n" "i l"'
        - grid-template-columns: 26px 1fr
        - grid-template-rows: 1fr 1fr
        - column-gap: 8px
        - height: 100%
      icon:
        - width: 22px
        - color: var(--primary-color)
      img_cell:
        - align-self: center
      name:
        - justify-self: start
        - align-self: end
        - font-size: 14px
        - font-weight: '500'
        - max-width: 100%
        - overflow: hidden
        - text-overflow: ellipsis
        - white-space: nowrap
      label:
        - justify-self: start
        - align-self: start
        - font-size: 11px
        - color: var(--secondary-text-color)
views:
  - title: Lista zakupowa
    path: lista-zakupowa
    icon: mdi:format-list-bulleted
    type: sections
    max_columns: 4
    sections:
      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: Lista zakupów
            icon: mdi:cart-outline
            grid_options: { columns: full, rows: 1 }
          - type: heading
            heading: Często kupowane – kliknij, aby dodać
            heading_style: subtitle
            grid_options: { columns: full, rows: 1 }
          - type: custom:button-card
            template: zakupy_chip
            variables: { i: 0 }
            grid_options: { columns: 4, rows: 1 }
          - type: custom:button-card
            template: zakupy_chip
            variables: { i: 1 }
            grid_options: { columns: 4, rows: 1 }
          - type: custom:button-card
            template: zakupy_chip
            variables: { i: 2 }
            grid_options: { columns: 4, rows: 1 }
          - type: custom:button-card
            template: zakupy_chip
            variables: { i: 3 }
            grid_options: { columns: 4, rows: 1 }
          - type: custom:button-card
            template: zakupy_chip
            variables: { i: 4 }
            grid_options: { columns: 4, rows: 1 }
          - type: custom:button-card
            template: zakupy_chip
            variables: { i: 5 }
            grid_options: { columns: 4, rows: 1 }
          - type: custom:button-card
            template: zakupy_chip
            variables: { i: 6 }
            grid_options: { columns: 4, rows: 1 }
          - type: custom:button-card
            template: zakupy_chip
            variables: { i: 7 }
            grid_options: { columns: 4, rows: 1 }
          - type: custom:button-card
            template: zakupy_chip
            variables: { i: 8 }
            grid_options: { columns: 4, rows: 1 }
          - type: custom:button-card
            template: zakupy_chip
            variables: { i: 9 }
            grid_options: { columns: 4, rows: 1 }
          - type: custom:button-card
            template: zakupy_chip
            variables: { i: 10 }
            grid_options: { columns: 4, rows: 1 }
          - type: custom:button-card
